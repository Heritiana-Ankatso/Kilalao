name: Android app

# Builds the Android app from app/ on every push to main (debug APK as a
# workflow artifact). Pushing a tag such as v1.0.1 builds a signed release
# APK and attaches it to a GitHub Release.
#
# Release signing needs these repository secrets:
#   KILALAO_KEYSTORE_BASE64    base64 of kilalao-release.jks
#   KILALAO_KEYSTORE_PASSWORD  keystore password
#   KILALAO_KEY_PASSWORD       key password (same as above unless changed)

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['app/**', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: kilalao-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_B64: ${{ secrets.KILALAO_KEYSTORE_BASE64 }}
          KILALAO_KEYSTORE_PASSWORD: ${{ secrets.KILALAO_KEYSTORE_PASSWORD }}
          KILALAO_KEY_PASSWORD: ${{ secrets.KILALAO_KEY_PASSWORD }}
          KILALAO_KEY_ALIAS: kilalao
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "Missing KILALAO_KEYSTORE_BASE64 secret" >&2; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kilalao-release.jks"
          export KILALAO_KEYSTORE="$RUNNER_TEMP/kilalao-release.jks"
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/kilalao-${GITHUB_REF_NAME}.apk"
          rm -f "$RUNNER_TEMP/kilalao-release.jks"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/kilalao-${{ github.ref_name }}.apk
          generate_release_notes: true
